server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/cart}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
catalog:
  url: ${CATALOG_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
