name: Lab 2 integration and evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    services:
      catalog-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catalog
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace -d catalog"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Consumer Pact test and generated contract
        run: |
          mkdir -p evidence tests/pact/pacts
          set -o pipefail
          mvn -B -ntp -pl src/cart-service test -Dtest=CatalogClientPactTest | tee evidence/pact-consumer-test.log
      - name: Verify real provider against generated Pact
        env:
          DB_URL: jdbc:postgresql://localhost:5433/catalog
        run: |
          set -o pipefail
          mvn -B -ntp -pl src/catalog-service test -Dtest=CatalogPactVerificationTest | tee evidence/pact-provider-verification.log
      - name: Start Docker Compose
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
      - name: Exercise API, rate limit, and capture health
        run: |
          set -o pipefail
          bash tests/test-api.sh | tee evidence/test-api-run.log
          bash tests/rate-limit-demo.sh | tee evidence/rate-limit-demo-run.log
          docker compose ps > evidence/docker-compose-ps.log
          cat evidence/docker-compose-ps.log
      - name: Publish proof and final annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/*.log tests/pact/pacts/*.json
          git commit -m 'test(lab2): проверенные логи и Pact [skip ci]'
          git push origin HEAD:main
          if ! git rev-parse lab1-complete >/dev/null 2>&1; then
            git tag -a lab1-complete d1b0b3d5d0c9ebf0f8608f6c81e035da3300dccb -m 'Лабораторная работа №1: макроархитектура'
            git push origin lab1-complete
          fi
          git tag -a lab2-complete -m 'Лабораторная работа №2: микросервисы, API Gateway, Pact'
          git push origin lab2-complete
      - name: Logs when integration fails
        if: failure()
        run: docker compose logs --tail=150 || true
